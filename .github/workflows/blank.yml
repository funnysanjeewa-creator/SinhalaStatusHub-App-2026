
name: Build Sinhala Status App

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app project
        run: |
          unzip -o *.zip -d project
          find project -name "settings.gradle.kts" -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name "settings.gradle.kts" -print -quit)")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SinhalaStatusHub-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
