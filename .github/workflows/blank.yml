    name: Build Sinhala Status App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find ZIP
        id: find_zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP_FILE"

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -o "${{ steps.find_zip.outputs.zip }}" -d project

      - name: Find Gradle project
        id: find_project
        run: |
          SETTINGS=$(find project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ steps.find_project.outputs.dir }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SinhalaStatusHub-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
