      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name "settings.gradle.kts" -type f | head -n 1)")
          cd "$PROJECT_DIR"

          echo "===== GRADLE BUILD START ====="
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
          BUILD_RESULT=${PIPESTATUS[0]}

          echo ""
          echo "===== IMPORTANT ERRORS ====="
          grep -n -E "What went wrong|Caused by:|error:|ERROR|FAILURE" build.log | head -n 40 || true

          echo ""
          echo "===== BUILD RESULT ====="
          echo "Exit code: $BUILD_RESULT"

          exit $BUILD_RESULT
